name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      # The pinned source files. The key is the contract, which names their hashes.
      - uses: actions/cache@v6
        with:
          path: data/raw
          key: source-${{ hashFiles('contracts/campaign_readout_v1.toml') }}
      - run: readout fetch
      - run: readout snapshot
      # With the source files present the tests include parity with the prototype on the real data.
      - run: python -m pytest
      - run: readout parity

  # The oldest versions of the dependencies that pyproject.toml admits.
  lowest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install uv
      - run: uv pip install --system --resolution lowest-direct -e ".[dev]"
      - uses: actions/cache@v6
        with:
          path: data/raw
          key: source-${{ hashFiles('contracts/campaign_readout_v1.toml') }}
      - run: readout fetch
      - run: python -m pytest

name: Results differ
description: A fresh run does not reproduce the committed tables, or parity with the prototype fails.
labels: [reproducibility]
body:
  - type: markdown
    attributes:
      value: |
        `make check` runs the whole pipeline into `fresh/` and compares its tables with `results/`.
        The last digits can differ across machines and library versions; the comparison allows for that.
  - type: textarea
    id: check
    attributes:
      label: Output of the comparison
      description: What `readout --results fresh/results check --reference results` printed, or the output of `readout parity`.
      render: text
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, the commit, and the output of `pip freeze` for numpy, pandas, scipy, pyarrow, pyreadr and matplotlib.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Options you ran with, such as `--replications`, and whether the registry was empty when the run started.

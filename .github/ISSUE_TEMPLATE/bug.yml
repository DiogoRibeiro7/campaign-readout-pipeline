name: Something does not work
description: A command fails, crashes or does something other than what the documentation says.
labels: [bug]
body:
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The command you ran, with every option.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: What it printed, including the exit status.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, the commit or release, and whether the libraries were installed with `-c constraints.txt`.
    validations:
      required: true
